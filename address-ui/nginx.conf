server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving the upstream at request time (via the
  # $upstream variable below) means a restarted address-api that comes back on a
  # new container IP is picked up automatically, instead of nginx caching the
  # old address until it is itself restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 2m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # SPA fallback — the app is client-routed.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Same-origin proxy to the API. Because the browser only ever talks to this
  # origin, the app works identically on localhost and on a LAN IP with no
  # rebuild and no CORS involved.
  location /api/ {
    set $upstream http://address-api:4000;
    # proxy_pass with a variable in it does NOT append the unmatched part of
    # the request. nginx passes the URI written in the directive verbatim, so
    # "proxy_pass $upstream/api/;" delivers every request as /api/ and the
    # upstream 404s on anything deeper. $request_uri carries the original path
    # and query string through intact, and the variable still forces upstream
    # resolution at request time.
    proxy_pass $upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
  }
}
