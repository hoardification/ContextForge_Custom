server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $upstream http://mcp-client:4200;
    # proxy_pass with a variable in it does NOT append the unmatched part of
    # the request. nginx passes the URI written in the directive verbatim, so
    # "proxy_pass $upstream/api/;" delivers every request as /api/ and the
    # upstream 404s on anything deeper. $request_uri carries the original path
    # and query string through intact, and the variable still forces upstream
    # resolution at request time.
    proxy_pass $upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # /api/ask/stream is server-sent events. Buffering would hold the progress
    # events until the run finished, which is exactly the blind wait this is
    # meant to remove - so buffering stays off and the read timeout stays long.
    # The backend heartbeats every 10s, and each event resets proxy_read_timeout,
    # so the connection only drops if the agent really has gone quiet.
    proxy_set_header Connection '';
    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_buffering       off;
    proxy_cache           off;
  }
}
